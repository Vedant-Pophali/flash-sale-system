apiVersion: apps/v1
kind: Deployment
metadata:
  name: flashsale-gateway
  labels:
    app: flashsale-gateway
spec:
  replicas: 4
  selector:
    matchLabels:
      app: flashsale-gateway
  template:
    metadata:
      labels:
        app: flashsale-gateway
    spec:
      containers:
        - name: gateway
          image: flashsale-engine:latest
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              value: "redis://redis-service:6379"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq-service:5672/"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flashsale-gateway-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flashsale-gateway
  minReplicas: 4
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
