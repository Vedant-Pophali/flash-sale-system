events {
    worker_connections 10240;
}

http {
    # Edge rate-limiting zone: 10 requests/sec per IP with burst capacity
    limit_req_zone $binary_remote_addr zone=flashsale_limit:10m rate=10r/s;

    upstream stateless_gateway_cluster {
        least_conn;
        server host.docker.internal:8000;
    }

    server {
        listen 80;

        location /api/v1/checkout {
            limit_req zone=flashsale_limit burst=20 nodelay;
            proxy_pass http://stateless_gateway_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://stateless_gateway_cluster;
        }
    }
}