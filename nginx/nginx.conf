events {
    worker_connections 20480;
}

http {
    limit_req_zone $binary_remote_addr zone=flashsale_limit:20m rate=25000r/s;

    upstream stateless_gateway_cluster {
        least_conn;
        server host.docker.internal:8001 max_fails=3 fail_timeout=5s;
        server host.docker.internal:8002 max_fails=3 fail_timeout=5s;
        server host.docker.internal:8003 max_fails=3 fail_timeout=5s;
        server host.docker.internal:8004 max_fails=3 fail_timeout=5s;
        server host.docker.internal:8000 backup;
        keepalive 512;
    }

    server {
        listen 80;

        location /api/v1/checkout {
            limit_req zone=flashsale_limit burst=5000 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://stateless_gateway_cluster;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://stateless_gateway_cluster;
        }
    }
}